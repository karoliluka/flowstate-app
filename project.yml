name: Flowstate
options:
  bundleIdPrefix: com.lukakaroli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Preview is a debug build without the Screen Time capability, so it can be
# signed with a free Apple account. App blocking is turned off in it.
# TestFlight is the same without blocking, but optimized and signed for App Store
# Connect (profiles from scripts/setup-signing.py). It stays until Apple approves the
# Family Controls distribution entitlement; then the Release build can go to TestFlight.
configs:
  Debug: debug
  Release: release
  Preview: debug
  TestFlight: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set this to your Apple Developer Team ID to run on a real iPhone.
    DEVELOPMENT_TEAM: YQ9H9S829Y

targets:
  Flowstate:
    type: application
    platform: iOS
    sources: [Flowstate, Shared, SharedUI]
    dependencies:
      - target: FlowstateWidgets
    info:
      path: Flowstate/Resources/Info.plist
      properties:
        CFBundleDisplayName: flowstate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Same dark background as the intro, so launching doesn't flash white first.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Only Apple's built-in encryption (HTTPS etc.), so App Store Connect skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # The running session as a Live Activity on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukakaroli.flowstate
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Flowstate/Resources/Flowstate.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Preview:
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PREVIEW"
        TestFlight:
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PREVIEW"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: flowstate App Store

  # Draws the running session's Live Activity (Lock Screen and Dynamic Island).
  FlowstateWidgets:
    type: app-extension
    platform: iOS
    sources: [FlowstateWidgets, SharedUI]
    info:
      path: FlowstateWidgets/Info.plist
      properties:
        CFBundleDisplayName: flowstate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukakaroli.flowstate.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        TestFlight:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: flowstate widgets App Store

  FlowstateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FlowstateTests]
    dependencies:
      - target: Flowstate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukakaroli.flowstate.tests
        GENERATE_INFOPLIST_FILE: YES

  # Drives the real Screen Time flow in the simulator; see FlowstateUITests/BlockingUITests.swift.
  FlowstateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FlowstateUITests]
    dependencies:
      - target: Flowstate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukakaroli.flowstate.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Full app with Screen Time blocking (needs a paid developer account on a real iPhone).
  Flowstate:
    build:
      targets:
        Flowstate: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [FlowstateTests, FlowstateUITests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Runs on a free Apple account; everything except app blocking.
  Flowstate Preview:
    build:
      targets:
        Flowstate: all
    run:
      config: Preview
    test:
      config: Preview
    profile:
      config: Preview
    analyze:
      config: Preview
    archive:
      config: Preview

  # Archived by scripts/testflight.sh: everything except app blocking, signed for App Store Connect.
  Flowstate TestFlight:
    build:
      targets:
        Flowstate: all
    run:
      config: TestFlight
    profile:
      config: TestFlight
    analyze:
      config: TestFlight
    archive:
      config: TestFlight
